{% load static %}

<header>
    <div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom shadow-sm">
    <a href="/" class="d-flex align-items-center text-decoration-none me-md-auto">
        <img src="{% static 'images/logo-1c.png' %}"
             alt="Логотип фирмы 1С"
             width="70"
             height="70"
             class="img-fluid me-2">

        <h5 class="my-0 fw-normal">Продукты 1С</h5>
    </a>

    <nav class="mt-3 mt-md-0">
        <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'users:logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="p-2 btn btn-outline-primary">Выход</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
</header>
