{% extends 'base.html' %}

{% block title %}
    Удаление публикации
{% endblock %}

{% block content %}
<div class="container py-4">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card border-danger">
                <div class="card-body text-center">

                    <h1 class="text-danger">
                        Удаление публикации
                    </h1>

                    <p>
                        Вы действительно хотите удалить
                        публикацию «{{ object.title }}»?
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <button type="submit"
                                class="btn btn-danger">
                            Да, удалить
                        </button>

                        <a href="{% url 'catalog:blog_detail' blog_id=object.pk %}"
                           class="btn btn-secondary">
                            Отмена
                        </a>
                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
