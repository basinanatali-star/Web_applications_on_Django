{% extends 'base.html' %}

{% block title %}
    Форма публикации
{% endblock %}

{% block content %}
<div class="container py-4">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card">
                <div class="card-body">

                    {% if object %}
                        <h1>Редактирование публикации</h1>
                    {% else %}
                        <h1>Создание публикации</h1>
                    {% endif %}

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit"
                                class="btn btn-success">
                            Сохранить
                        </button>

                        <a href="{% url 'catalog:blog_list' %}"
                           class="btn btn-secondary">
                            Отмена
                        </a>
                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
