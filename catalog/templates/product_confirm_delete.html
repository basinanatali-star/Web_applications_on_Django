{% extends 'base.html' %}

{% block title %}
    Удаление продукта
{% endblock %}

{% block content %}
<div class="container py-4">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card border-danger">
                <div class="card-body text-center">

                    <h1 class="text-danger">
                        Удаление продукта
                    </h1>

                    <p>
                        Вы действительно хотите удалить
                        продукт «{{ product.name }}»?
                    </p>

                    <form method="post">
                        {% csrf_token %}

                        <button type="submit"
                                class="btn btn-danger">
                            Да, удалить
                        </button>

                        <a href="{% url 'catalog:product_detail' product_id=product.id %}"
                           class="btn btn-secondary">
                            Отмена
                        </a>
                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
