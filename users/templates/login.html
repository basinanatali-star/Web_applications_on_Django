{% extends 'base.html' %}

{% block title %}
    Форма входа
{% endblock %}

{% block content %}
<div class="container py-4">

    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card">
                <div class="card-body">
                        <h1>Вход пользователя</h1>
                    
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit"
                                class="btn btn-success">
                            Войти
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
